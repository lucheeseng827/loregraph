<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Air-gap posture: same-origin only. Any accidental CDN fetch fails loudly. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>loregraph — memory canvas</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-name">loregraph</span>
      <span class="brand-sub">memory knowledge-graph · PoC canvas</span>
    </div>
    <div class="search">
      <input id="q" type="search" aria-label="Search memory" placeholder="ask: what do we already know about…" autocomplete="off" />
      <button id="q-btn" type="button">Search</button>
    </div>
    <div class="stats" id="stats">— nodes · — edges</div>
    <nav class="filters" id="filters"><!-- type chips injected --></nav>
    <button id="reload" type="button" class="btn">Reload</button>
  </header>

  <div class="banner" id="banner" hidden><span id="banner-msg"></span><button id="banner-x" type="button" aria-label="Dismiss message">×</button></div>

  <main class="stage">
    <canvas id="canvas"></canvas>
    <aside class="panel" id="panel" hidden>
      <button class="panel-x" id="panel-x" type="button" aria-label="Close panel">×</button>
      <h2 id="panel-title">node</h2>
      <div class="panel-kind" id="panel-kind"></div>
      <pre class="panel-body" id="panel-body"></pre>
      <h3>Provenance</h3>
      <div class="panel-prov" id="panel-prov"></div>
      <h3>Neighbors</h3>
      <ul class="panel-neighbors" id="panel-neighbors"></ul>
    </aside>
  </main>

  <footer class="hint">drag to pan · scroll to zoom · click a node to expand · this is the OSS PoC renderer (Cytoscape/Sigma are the MVP/scale tiers — see PLAN.md §6)</footer>

  <script src="./app.js"></script>
</body>
</html>
